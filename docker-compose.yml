version: '3.8'

services:
  # ==========================================
  # Microsoft SQL Server 2022 Database
  # ==========================================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ftech-sqlserver
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=sa12345
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P sa12345 -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ==========================================
  # Java Web Application (Tomcat 10.1 + JDK 21)
  # ==========================================
  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ftech-lms-web
    restart: always
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - LEARNORA_DB_URL=jdbc:sqlserver://sqlserver:1433;databaseName=LearnoraDemoDB;encrypt=true;trustServerCertificate=true
      - LEARNORA_DB_USER=sa
      - LEARNORA_DB_PASSWORD=sa12345

volumes:
  mssql-data:
